required-version = "==0.16.0"
target-version = "py315"
preview = true
exclude = [
    # artifacts/ 保存固定的證據樹。44 份 evidence JSON 記錄其中 .py 腳本
    # 的 SHA256，並已逐位元核對；原樣保存可維持這些證據的完整性。
    # 維護中的原始碼使用下列檢查，封存證據保持原始位元組。
    "artifacts",
    ".venv",
    ".venv315",
    ".quality-tmp",
    ".quality-cache",
    "build",
    "build-temp",
    "dist",
    "release-artifacts",
]

# The select list below defines the enforced correctness and complexity
# checks. Release validation preserves behavior; refactoring follows the
# established maintenance and regression process.
#
# PLR2004 (magic-value-comparison) is promoted to the release-blocking gate
# after the v4.3.0 magic-number cleanup: every comparison against a bare
# literal must reference a named constant, so new magic numbers are rejected
# at CI time instead of accumulating for a later cleanup pass.
[lint]
# Keep the broad families visible here so newly added rules become reviewable
# instead of silently falling outside the gate. TRY is intentionally narrower:
# only rules with low false-positive risk for this callback- and adapter-heavy
# desktop application are release blocking.
select = [
    "F",
    "E",
    "W",
    "B",
    "UP",
    "SIM",
    "PERF",
    "RUF",
    "PL",
    "C4",
    "PIE",
    "RET",
    "TRY300",
    "TRY400",
    "TRY401",
]

# Every excluded rule has a repository-specific reason. These are rule-level
# exceptions only; whole-file lint suppression remains forbidden.
ignore = [
    # Four-language prose, URLs, command examples, and user-facing diagnostics
    # are kept intact. Reflowing them would damage parallel translations or
    # make exact commands harder to copy; formatting is enforced structurally.
    "E501",
    # Executable tools and Qt tests must establish sys.path, environment, or a
    # headless Qt platform before importing the code under test.
    "E402",
    # Traditional/Simplified Chinese and Japanese deliberately contain the
    # Unicode punctuation and glyphs that these three ambiguity checks flag.
    "RUF001",
    "RUF002",
    "RUF003",
    # Pixel, alpha, geometry, and benchmark contracts intentionally compare
    # exact values after deterministic integer/float conversion.
    "RUF069",
    # Numeric rule identifiers are the stable, searchable contract used by CI
    # output, upgrade notes, and this repository's documented exception list.
    "RUF201",
    # Qt callbacks, Protocol implementations, and replaceable strategy objects
    # preserve instance-method signatures even when one implementation does
    # not currently read instance state.
    "PLR6301",
    # Package-private helpers are intentional typed collaboration points inside
    # a canonical owner package; public compatibility facades remain separate.
    "PLC2701",
    # Lazy imports are a Python 3.15 startup contract, while optional provider
    # imports and cycle-breaking composition imports must stay at point of use.
    "PLC0415",
    # Cleanup and rollback blocks intentionally keep all fallible statements in
    # one try so partial installer/profile transactions fail as a unit.
    "PLW0717",
    # Complex boolean validation is concentrated in fail-closed policy gates;
    # splitting the expressions would obscure the invariant being enforced.
    "PLR0916",
    # A small set of parsers/render pipelines mirrors ordered domain stages;
    # flattening their nesting would duplicate state or weaken fail-closed flow.
    "PLR1702",
    # Qt windows and compatibility facades expose framework- or contract-owned
    # public methods; method count is not a meaningful cohesion signal there.
    "PLR0904",
    # Explicit try/except pass blocks mark optional platform capabilities and
    # make their deliberately ignored exception boundary searchable.
    "SIM105",
    # CLI probes and runtime hooks use a few explicit module-level state slots;
    # replacing global declarations would hide their process-wide ownership.
    "PLW0603",
    # Empty strings are typed persistence/UI sentinels in this project. Exact
    # equality documents that contract and avoids accepting unrelated falsey
    # values in tests and boundary code.
    "PLC1901",
    # Rebinding is intentionally distinct from in-place mutation for numpy,
    # Qt, and user-defined values; an automatic augmented assignment can change
    # alias-visible behavior.
    "PLR6104",
    # Small callback adapters and test probes use assigned lambdas to keep the
    # callable adjacent to its injection site without inventing a public name.
    "E731",
    "PLW0108",
    # Public viseme enum members I/O and conventional linear-algebra locals are
    # stable domain notation rather than ambiguous prose variable names.
    "E741",
    # Generator context managers here intentionally propagate body exceptions;
    # they guarantee cleanup/commit behavior without translating every error.
    "RUF075",
    # Returning directly from a successful try keeps the success path adjacent
    # to the operation; the except clauses already isolate the intended errors.
    "TRY300",
    # Explicit self-alias imports are intentional re-exports from compatibility
    # modules and make the public API visible to Ruff and type checkers.
    "PLC0414",
    # pytest match values deliberately use regular-expression alternation and
    # wildcards; escaping them would change the asserted diagnostic contract.
    "RUF043",
    # Test doubles and audit recorders use class-level call registries so fresh
    # instances contribute to one deliberately shared assertion surface.
    "RUF012",
    # This provenance-only value object uses explicit slots and construction to
    # avoid dataclass-generated equality/repr becoming part of its contract.
    "B903",
]

# These configured complexity thresholds accommodate existing 6-7 argument
# constructors and explicit validation chains. The values below remain the
# active limits; future threshold changes follow the maintenance process.
[lint.pylint]
max-args = 7
max-returns = 8
max-branches = 15
max-statements = 60
max-locals = 20

# The RGBA compositing protocol methods are performance-critical and their
# 11-argument signature is a stable cross-module contract (native acceleration
# and pure-Python fallback must stay interchangeable).  They are exempt from
# the argument-count rule rather than refactored into a parameter bundle that
# would add per-frame allocation overhead on the 50 Hz render loop.
[lint.per-file-ignores]
"application/native_rgba_acceleration.py" = ["PLR0913", "PLR0917"]
"application/rgba_compositing.py" = ["PLR0913", "PLR0917"]
"tests/test_native_rgba_product_wiring.py" = ["PLR0913", "PLR0917"]
# The following existing function owners remain tracked refactor targets.
# Their recorded per-file exceptions apply only to the listed rules; every
# other selected check and the remaining module limits stay active.
"presentation/companion_core.py" = ["PLR0915"]
"presentation/companion_visual_dynamics.py" = ["PLR0915"]
"presentation/dashboard_shell.py" = ["PLR0915"]
# 姿勢引擎的 main／validate 是線性的量測腳本主流程，拆函式只會把
# 讀取順序打散；下列設定僅列複雜度例外，魔術數規則仍完整執行。
"tools/second_gen_body/repose_arms_candidate5.py" = ["PLR0914", "PLR0915"]
"tools/second_gen_body/repose_arms_candidate6_dqs.py" = ["PLR0914", "PLR0915"]
"tools/second_gen_body/test_pose_engine.py" = ["PLR0914", "PLR0915"]
"tests/test_release_automation.py" = ["PLR0914"]
"tools/analyze_layered_assets.py" = ["PLR0912", "PLR0914", "PLR0915"]
"tools/build_pose_atlas_release_assets.py" = ["PLR0914"]
# 二代素體產線的兩支 CPU 光柵化器、四肢形變主程式與臉部細修入口。
# 光柵化的內層迴圈需要同時持有螢幕座標、重心座標、深度與法線緩衝，
# 拆成小函式只會讓每格像素多一次呼叫、也更難對照公式；形變主程式是
# 「載入→形變→逐項驗證→寫出報告」的線性流程，保留順序可直接核對。
# 以下既有例外僅涵蓋明列的複雜度規則；
# PLR2004（裸數值比較）在這個目錄零豁免，全部門檻都已具名並記錄校準範圍。
"tools/second_gen_body/render_controls_c4.py" = ["PLR0914"]
"tools/second_gen_body/probes/render_candidates.py" = ["PLR0914"]
"tools/second_gen_body/morph_limbs_candidate4.py" = ["PLR0912", "PLR0914", "PLR0915"]
"tools/second_gen_body/face_detailer.py" = ["PLR0913"]
