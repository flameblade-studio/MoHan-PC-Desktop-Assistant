required-version = "==0.16.0"
target-version = "py315"
preview = true
exclude = [
    ".venv",
    ".venv315",
    "build",
    "build-temp",
    "dist",
    "release-artifacts",
]

# Keep the release-blocking gate on Pyflakes correctness checks.
# The optional complexity and micro-refactoring rules are intentionally
# introduced as non-blocking, incremental maintenance work after v4.0.0;
# they must not force behavior-changing refactors during release validation.
#
# PLR2004 (magic-value-comparison) is promoted to the release-blocking gate
# after the v4.3.0 magic-number cleanup: every comparison against a bare
# literal must reference a named constant, so new magic numbers are rejected
# at CI time instead of accumulating for a later cleanup pass.
[lint]
select = ["F", "PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915"]

# Complexity rules are introduced as non-blocking, incremental maintenance.
# The thresholds are deliberately looser than Pylint's defaults so they only
# flag genuinely over-complex functions (e.g. an 11-argument protocol method)
# rather than the many reasonable 6-7 argument constructors and fail-fast
# validation chains that already exist across the codebase.  Tightening these
# thresholds is a follow-up maintenance task, not a release gate.
[lint.pylint]
max-args = 7
max-returns = 8
max-branches = 15
max-statements = 60
max-locals = 20

# The RGBA compositing protocol methods are performance-critical and their
# 11-argument signature is a stable cross-module contract (native acceleration
# and pure-Python fallback must stay interchangeable).  They are exempt from
# the argument-count rule rather than refactored into a parameter bundle that
# would add per-frame allocation overhead on the 50 Hz render loop.
[lint.per-file-ignores]
"application/native_rgba_acceleration.py" = ["PLR0913"]
"application/rgba_compositing.py" = ["PLR0913"]
"tests/test_native_rgba_product_wiring.py" = ["PLR0913"]
# Genuinely over-complex functions that remain as known, tracked follow-up
# refactor targets.  They are exempt so the non-blocking complexity rules do
# not fail CI, while still guarding every new function against regressing
# past the (already loose) thresholds above.
"presentation/companion_core.py" = ["PLR0915"]
"presentation/companion_visual_dynamics.py" = ["PLR0915"]
"presentation/dashboard_shell.py" = ["PLR0915"]
"tests/test_release_automation.py" = ["PLR0914"]
"tools/analyze_layered_assets.py" = ["PLR0912", "PLR0914", "PLR0915"]
"tools/build_pose_atlas_release_assets.py" = ["PLR0914"]
# 二代素體產線的兩支 CPU 光柵化器、四肢形變主程式與臉部細修入口。
# 光柵化的內層迴圈需要同時持有螢幕座標、重心座標、深度與法線緩衝，
# 拆成小函式只會讓每格像素多一次呼叫、也更難對照公式；形變主程式是
# 「載入→形變→逐項驗證→寫出報告」的線性流程，拆開反而看不出驗證順序。
# 這裡豁免的只有 ruff.toml 自述為 non-blocking 的複雜度規則；
# PLR2004（裸數值比較）在這個目錄零豁免，全部門檻都已具名並記錄校準範圍。
"tools/second_gen_body/render_controls_c4.py" = ["PLR0914"]
"tools/second_gen_body/probes/render_candidates.py" = ["PLR0914"]
"tools/second_gen_body/morph_limbs_candidate4.py" = ["PLR0912", "PLR0914", "PLR0915"]
"tools/second_gen_body/face_detailer.py" = ["PLR0913"]
