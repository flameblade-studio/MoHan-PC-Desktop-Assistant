name: Four-language PR governance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  validate-pr-body:
    name: 四語 PR 說明 / 四语 PR 说明 / Four-language PR body / 四言語 PR 本文
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require four-language PR title and body metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Release Please 的標題是可控的版本識別資料，必須通過四語標題檢查，
          # 才能讓自動發版在 main 歷史中留下四語標題。
          # Release Please 的說明是機器產生的變更清單，不是人寫的敘述，
          # 因此只豁免 body 的四語章節檢查，不豁免標題。
          # 豁免仍須同時符合 release-please 分支與 github-actions[bot] 作者；
          # 單靠分支名不能繞過治理。
          head_ref=$(jq -r '.pull_request.head.ref // ""' "$GITHUB_EVENT_PATH")
          pr_author=$(jq -r '.pull_request.user.login // ""' "$GITHUB_EVENT_PATH")
          title=$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")
          body=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          # GitHub's web editor stores CRLF. Normalize line endings before
          # applying exact, platform-independent heading checks.
          title=${title//$'\r'/}
          body=${body//$'\r'/}
          # Dependabot title normalization writes through a separate trusted
          # workflow.  GITHUB_TOKEN edits do not create an automatic `edited`
          # workflow run, so read the live title before validating this run.
          # Human and other bot PRs keep the original event-driven behavior.
          if [[ "$pr_author" == "dependabot[bot]" && "$title" != *'／'* ]]; then
            live_title="$title"
            for attempt in {1..12}; do
              live_title=$(gh pr view "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json title \
                --jq '.title')
              if [[ "$live_title" != "$title" ]]; then
                break
              fi
              sleep 5
            done
            if [[ "$live_title" != "$title" ]]; then
              title=${live_title//$'\r'/}
              current_event="$RUNNER_TEMP/pr-event-current.json"
              jq --arg current_title "$title" \
                '.pull_request.title = $current_title' \
                "$GITHUB_EVENT_PATH" > "$current_event"
              printf 'GITHUB_EVENT_PATH=%s\n' "$current_event" >> "$GITHUB_ENV"
            fi
          fi
          IFS='／' read -r -a title_parts <<< "$title"
          if [[ ${#title_parts[@]} -ne 4 ]]; then
            echo "標題必須有四段翻譯 / 标题必须有四段翻译 / Title requires four translations / タイトルには四つの翻訳が必要です" >&2
            exit 1
          fi
          for part in "${title_parts[@]}"; do
            if [[ -z "${part//[[:space:]]/}" ]]; then
              echo "四語標題不得留白 / 四语标题不得留白 / Title translations cannot be empty / タイトルの翻訳を空欄にできません" >&2
              exit 1
            fi
          done
          if [[ "$head_ref" == release-please--branches--* \
                && "$pr_author" == "github-actions[bot]" ]]; then
            echo "RELEASE_PLEASE_BODY_EXEMPT"
            exit 0
          fi
          headings=(
            "## 繁體中文"
            "## 简体中文"
            "## English"
            "## 日本語"
          )
          for heading in "${headings[@]}"; do
            if ! printf '%s\n' "$body" | awk -v heading="$heading" '
              $0 == heading && !started { started = 1; inside = 1; next }
              inside && /^## / { inside = 0 }
              inside && /[^[:space:]]/ { found = 1 }
              END { exit (started && found) ? 0 : 1 }
            '; then
              echo "缺少非空白四語章節 / 缺少非空白四语章节 / Missing non-empty language section / 空でない四言語セクションが必要です: $heading" >&2
              exit 1
            fi
          done
          mapfile -t actual_headings < <(
            printf '%s\n' "$body" |
              grep -E '^## (繁體中文|简体中文|English|日本語)$' || true
          )
          if [[ ${#actual_headings[@]} -ne 4 ]]; then
            echo "四語章節必須各出現一次 / 四语章节必须各出现一次 / Each language section must appear once / 各言語セクションは一度だけ必要です" >&2
            exit 1
          fi
          for index in "${!headings[@]}"; do
            if [[ "${actual_headings[$index]}" != "${headings[$index]}" ]]; then
              echo "四語順序錯誤 / 四语顺序错误 / Incorrect language order / 四言語の順序が正しくありません" >&2
              exit 1
            fi
          done
          echo "FOUR_LANGUAGE_PR_METADATA_MINIMUM_OK"

      - name: Check out the proposed documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true

      - name: Require structurally equivalent PR metadata
        run: python tools/check_four_language_pr.py

      - name: Require structurally equivalent four-language documentation
        run: python tools/check_four_language_docs.py
