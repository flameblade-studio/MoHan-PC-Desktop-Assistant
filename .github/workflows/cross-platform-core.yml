name: Cross-platform core

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUSTUP_TOOLCHAIN: "1.97.1"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip

      - name: Install Ubuntu Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libportaudio2

      - name: Build verified Qt 3.15 compatibility wheelhouse
        run: python tools/build_python315_qt_compat.py --output-dir qt315-wheelhouse

      - name: Install dependencies
        run: >-
          python tools/install_python315_dependencies.py
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Install pinned native build toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          python -m pip install --only-binary=:all: maturin==1.14.1

      - name: Build and verify native acceleration
        run: |
          python tools/build_native_acceleration.py --output-dir native-wheels --evidence native-wheels/build-evidence.json --install
          python -m pytest tests/test_native_equivalence.py tests/test_native_rgba_equivalence.py -q
          python tools/benchmark_native_rgba.py --width 512 --height 512 --iterations 3

      - name: Compile source
        run: python -m compileall -q .

      - name: Verify platform imports, paths, migration, and Qt offscreen
        run: python tests/test_cross_platform_core.py

      - name: Verify provider registry migration
        run: python tests/test_speech_provider_registry.py

      - name: Verify architecture boundaries
        run: python tests/test_architecture_contracts.py

      - name: Verify platform-neutral audio and memory core
        run: |
          python tests/test_pcm_audio.py
          python tests/test_audio_buffer.py
          python tests/test_memory_vector_index.py
