name: Character pack lock consistency

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-pack-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-character-pack-lock:
    name: Verify public assets equal the locked private pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip

      - name: Build verified Qt 3.15 compatibility wheelhouse
        run: python tools/build_python315_qt_compat.py --output-dir qt315-wheelhouse

      - name: Install pinned runtime dependencies
        run: >-
          python tools/install_python315_dependencies.py
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Rebuild and verify the locked MoHan character pack
        run: python tools/verify_character_pack_lock.py
