name: Character pack lock consistency

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-pack-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-character-pack-lock:
    name: Verify public character-pack release locks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          cache: pip

      - name: Install the Qt runtime library used to decode pack images
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install pinned runtime dependencies from official wheels
        run: >-
          python -m pip install --only-binary=:all:
          --report qt-install-report.json
          -r requirements.txt

      - name: Verify official Qt runtime and wheel provenance
        run: >-
          python tools/check_official_qt_runtime.py
          --pip-report qt-install-report.json

      - name: Rebuild and verify the locked MoHan character pack
        run: python tools/verify_character_pack_lock.py

      - name: Rebuild and verify the locked Lin Keyun character pack
        run: python tools/verify_character_pack_lock.py --profile lin-keyun
