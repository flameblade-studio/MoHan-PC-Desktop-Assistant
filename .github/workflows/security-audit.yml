name: Python Security Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["main"]
    paths:
      - "requirements.txt"
      - "requirements-preview.txt"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pip-audit 2.10.1 still imports sre_constants through pip-api and cannot
      # start on 3.15. This runtime is isolated audit tooling; MoHan itself,
      # its tests, and every release package remain locked to Python 3.15.
      - name: Set up isolated audit-tool runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"
          cache: pip

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit runtime requirements
        run: |
          python -m pip_audit -r requirements.txt --strict
          python -m pip_audit -r requirements-preview.txt --strict
