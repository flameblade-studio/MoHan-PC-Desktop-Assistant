name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to package and publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
  WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
  WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
  WORDPRESS_DOWNLOAD_PAGE_ID: ${{ secrets.WORDPRESS_DOWNLOAD_PAGE_ID }}

jobs:
  build-release:
    name: build-test-attest-release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a semantic, v-prefixed version: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime and release dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install cyclonedx-bom==7.3.0

      - name: Install Windows installer toolchains
        shell: pwsh
        run: choco install innosetup wixtoolset --no-progress -y

      - name: Compile source
        run: python -m compileall -q .

      - name: Audit public release contents
        run: python tools/audit_public_release.py

      - name: Run full regression suite
        run: python tests/run_all.py

      - name: Build Windows application
        shell: pwsh
        run: .\build.ps1 -Version "${{ steps.release.outputs.version }}" -Python (Get-Command python).Source

      - name: Run packaged self-test and event-loop smoke test
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $appDir = Join-Path $PWD "dist\MoHan-Desktop-Assistant-$version"
          $exe = Join-Path $appDir "MoHan-Desktop-Assistant-$version.exe"
          $env:MOHAN_DATA_DIR = Join-Path $env:RUNNER_TEMP "mohan-packaged-profile"
          New-Item -ItemType Directory -Force $env:MOHAN_DATA_DIR | Out-Null
          $selfTest = Join-Path $env:RUNNER_TEMP "mohan-packaged-selftest.txt"
          $smokeTest = Join-Path $env:RUNNER_TEMP "mohan-packaged-smoke.txt"
          $process = Start-Process -FilePath $exe -ArgumentList @(
            "--self-test",
            "--self-test-output=$selfTest"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Get-Content -Raw $selfTest) -ne "PACKAGED_SELFTEST_OK") {
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }
          $process = Start-Process -FilePath $exe -ArgumentList @(
            "--smoke-auto-exit",
            "--smoke-output=$smokeTest"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Get-Content -Raw $smokeTest) -ne "PACKAGED_EVENT_LOOP_OK") {
            throw "Packaged event-loop smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create portable ZIP and CycloneDX SBOM
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $appDir = Join-Path $PWD "dist\MoHan-Desktop-Assistant-$version"
          if (-not (Test-Path $appDir)) { throw "Expected build folder not found: $appDir" }
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $zip = Join-Path $PWD "release-artifacts\MoHan-Desktop-Assistant-$tag-Windows-x64.zip"
          $sbom = Join-Path $PWD "release-artifacts\MoHan-Desktop-Assistant-$tag-SBOM.cdx.json"
          Compress-Archive -Path $appDir -DestinationPath $zip -CompressionLevel Optimal
          cyclonedx-py requirements requirements.txt --output-format JSON --output-file $sbom

      - name: Build EXE and MSI installers
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          .\installer\build_installers.ps1 `
            -AppDir "dist\MoHan-Desktop-Assistant-$version" `
            -Version $version `
            -Tag "${{ steps.release.outputs.tag }}" `
            -OutputDir "release-artifacts"

      - name: Verify EXE and MSI installers
        shell: pwsh
        run: |
          .\installer\test_installers.ps1 `
            -ArtifactsDir "release-artifacts" `
            -Version "${{ steps.release.outputs.version }}"

      - name: Create update manifest and SHA256 catalog
        shell: pwsh
        run: |
          python tools/create_release_metadata.py `
            --artifacts release-artifacts `
            --tag "${{ steps.release.outputs.tag }}" `
            --repository "${{ github.repository }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MoHan-${{ steps.release.outputs.tag }}-Windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: release-artifacts/*

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $assets = Get-ChildItem release-artifacts -File | ForEach-Object { $_.FullName }
          $args = @("release", "create", $tag) + $assets + @(
            "--repo", "${{ github.repository }}",
            "--verify-tag",
            "--title", "MoHan Desktop Assistant $tag",
            "--generate-notes"
          )
          if ($tag -match '-') { $args += "--prerelease" }
          & gh @args

      - name: Synchronize official WordPress MoHan page
        if: ${{ env.WORDPRESS_BASE_URL != '' && env.WORDPRESS_USERNAME != '' && env.WORDPRESS_APP_PASSWORD != '' }}
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $manifest = "release-artifacts\MoHan-Desktop-Assistant-$tag-update.json"
          python tools/sync_wordpress_download_page.py `
            --manifest $manifest `
            --release-url "https://github.com/${{ github.repository }}/releases/tag/$tag"

      - name: Explain skipped website synchronization
        if: ${{ env.WORDPRESS_BASE_URL == '' || env.WORDPRESS_USERNAME == '' || env.WORDPRESS_APP_PASSWORD == '' }}
        shell: pwsh
        run: |
          "::notice::Official website synchronization was skipped because the WordPress GitHub Secrets are not configured."
