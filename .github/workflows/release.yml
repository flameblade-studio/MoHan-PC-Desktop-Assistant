name: Multi-platform Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable vN.N.N or vN.N.N-rc.N tag to package"
        required: true
        type: string
      publish:
        description: "Publish a new stable release or pre-release after verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve-release:
    name: validate-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve and restrict release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            prerelease=true
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            echo "Only immutable vN.N.N or vN.N.N-rc.N tags are accepted: $tag" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check out complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Require the tagged commit to belong to main history
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          mapfile -t source_versions < <(
            sed -n 's/^FALLBACK_VERSION = "\([^"]*\)"$/\1/p' domain/version_info.py
          )
          if [[ "${#source_versions[@]}" -ne 1 ]]; then
            echo "Expected exactly one literal FALLBACK_VERSION in domain/version_info.py" >&2
            exit 3
          fi
          source_version="${source_versions[0]}"
          if [[ "$source_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag version $RELEASE_VERSION does not match source version $source_version" >&2
            exit 3
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Validate Release publication mode before packaging
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          releases_api="repos/${{ github.repository }}/releases"
          release_id="$(
            gh api --paginate "$releases_api?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id"
          )"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_INPUT" != "true" ]]; then
            [[ "$release_id" =~ ^[0-9]+$ ]] || {
              echo "Expected an existing Release for verification before packaging: $RELEASE_TAG" >&2
              exit 7
            }
            release_mode_matches="$(
              gh api "$releases_api/$release_id" \
                --jq ".draft == false and .prerelease == $EXPECTED_PRERELEASE"
            )"
            [[ "$release_mode_matches" == true ]] || {
              echo "Existing Release maturity does not match its tag: $RELEASE_TAG" >&2
              exit 7
            }
          elif [[ "$EVENT_NAME" == "release" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # release-please 透過 API 建立 tag/release（不觸發 push 事件）。
            # release 事件或明確的 workflow_dispatch 都允許在 release 已存在時
            # 上傳資產（而非重建），以補齊 release-please 建立的空 release。
            if [[ -n "$release_id" ]]; then
              release_mode_matches="$(
                gh api "$releases_api/$release_id" \
                  --jq ".draft == false and .prerelease == $EXPECTED_PRERELEASE"
              )"
              [[ "$release_mode_matches" == true ]] || {
                echo "Existing Release maturity does not match its tag: $RELEASE_TAG" >&2
                exit 7
              }
            fi
          elif [[ -n "$release_id" ]]; then
            echo "Release already exists; refusing to rebuild it: $RELEASE_TAG" >&2
            exit 7
          fi

      - name: Set up Python 3.15 release preflight runtime
        id: preflight-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true

      - name: Enforce thin app composition root before packaging
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.preflight-python.outputs.python-path }}
        run: |
          "$PREFLIGHT_PYTHON" tools/check_app_composition_root.py app.py

      - name: Validate MoHan Qt 3.15 compatibility policy before packaging
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.preflight-python.outputs.python-path }}
        run: |
          "$PREFLIGHT_PYTHON" tools/check_python315_qt_compatibility.py

      - name: Require curated four-language Release notes before packaging
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.preflight-python.outputs.python-path }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          [[ -s "$notes" ]]
          "$PREFLIGHT_PYTHON" tools/check_four_language_docs.py

      - name: Enforce reproducible v4 OpenAI Vision package gate
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.preflight-python.outputs.python-path }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          "$PREFLIGHT_PYTHON" tools/check_openai_vision_release.py \
            --version "$RELEASE_VERSION"

      - name: Synchronize version references from pyproject.toml
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.preflight-python.outputs.python-path }}
        run: |
          # Release Please only rewrites pyproject.toml reliably; propagate the
          # authoritative version to every other reference so the packaged
          # artifacts and the consistency checks always agree.
          "$PREFLIGHT_PYTHON" tools/sync_version.py

  windows:
    name: Windows formal packages
    needs: resolve-release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip

      - name: Build verified Qt 3.15 compatibility wheelhouse
        run: python tools/build_python315_qt_compat.py --output-dir qt315-wheelhouse

      - name: Install pinned runtime dependencies
        run: >-
          python tools/install_python315_dependencies.py
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Install pinned development quality tools
        run: >-
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Build native acceleration for full Windows regression
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          python -m pip install --only-binary=:all: maturin==1.14.1
          python tools/build_native_acceleration.py `
            --output-dir native-wheels `
            --evidence native-wheels/build-evidence.json `
            --install

      - name: Install pinned Windows installer toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          .\tools\install_windows_packaging_tools.ps1
          -InnoVersion "7.0.2"
          -WixVersion "7.0.0"

      - name: Compile and audit source
        run: |
          python -m compileall -q .
          python -m ruff check .
          python tools/audit_public_release.py

      - name: Run full Windows regression suite
        run: python tests/run_all.py

      - name: Check out pinned CPython 3.15.0rc1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: python/cpython
          ref: 37e98da7c19a9e5892ee756d6dee08225422cd49
          path: _python315
          persist-credentials: false

      - name: Build and verify JIT-default Python 3.15 runtime
        shell: pwsh
        run: |
          python tools/build_python315_jit_runtime.py `
            --source "$PWD\_python315" `
            --prefix "$env:RUNNER_TEMP\mohan-python315-jit"
          "MOHAN_JIT_PYTHON=$PWD\_python315\PCbuild\amd64\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies into JIT-default Python
        shell: pwsh
        run: >-
          & $env:MOHAN_JIT_PYTHON tools/install_python315_dependencies.py
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Install native build dependencies into JIT-default Python
        shell: pwsh
        run: |
          & $env:MOHAN_JIT_PYTHON -m pip install --only-binary=:all: -r requirements-dev.txt
          & $env:MOHAN_JIT_PYTHON -m pip install --only-binary=:all: maturin==1.14.1

      - name: Capture and package sanitized Tachyon evidence
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve-release.outputs.tag }}"
          $base = "MoHan-Desktop-Assistant-$tag"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mohan-tachyon-release"
          $artifactsDir = Join-Path $PWD "release-artifacts"
          New-Item -ItemType Directory -Force $artifactsDir | Out-Null
          & $env:MOHAN_JIT_PYTHON tools/profile_mohan_tachyon.py `
            --target all `
            --output-dir $evidenceDir `
            --min-samples 100 `
            --max-sample-read-error-percent 15 `
            --max-missed-samples-percent 10
          if ($LASTEXITCODE -ne 0) {
            throw "Tachyon release evidence failed with exit code $LASTEXITCODE"
          }
          Copy-Item `
            -LiteralPath (Join-Path $evidenceDir "mohan-tachyon-suite-summary.json") `
            -Destination (Join-Path $artifactsDir "$base-Performance-Summary.json")
          Compress-Archive `
            -Path (Join-Path $evidenceDir "*") `
            -DestinationPath (Join-Path $artifactsDir "$base-Performance-Evidence.zip") `
            -CompressionLevel Optimal

      - name: Build Windows application
        shell: pwsh
        run: >-
          .\build.ps1
          -Version "${{ needs.resolve-release.outputs.version }}"
          -Python $env:MOHAN_JIT_PYTHON

      - name: Verify native equivalence and packaged operations
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-release.outputs.version }}"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mohan-native-release"
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          & $env:MOHAN_JIT_PYTHON -m pytest tests/test_native_equivalence.py tests/test_native_rgba_equivalence.py -q
          & $env:MOHAN_JIT_PYTHON tools/benchmark_native_rgba.py --width 512 --height 512 --iterations 3
          & $env:MOHAN_JIT_PYTHON tools/verify_packaged_native_acceleration.py `
            "dist\MoHan-Desktop-Assistant-$version" `
            --label "onedir" `
            --output (Join-Path $evidenceDir "onedir.json")

      - name: Run packaged self-test and event-loop smoke test
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-release.outputs.version }}"
          $appDir = Join-Path $PWD "dist\MoHan-Desktop-Assistant-$version"
          $exe = Join-Path $appDir "MoHan-Desktop-Assistant-$version.exe"
          $env:MOHAN_DATA_DIR = Join-Path $env:RUNNER_TEMP "mohan-packaged-profile"
          New-Item -ItemType Directory -Force $env:MOHAN_DATA_DIR | Out-Null
          $selfTest = Join-Path $env:RUNNER_TEMP "mohan-packaged-selftest.txt"
          $smokeTest = Join-Path $env:RUNNER_TEMP "mohan-packaged-smoke.txt"
          $jitTest = Join-Path $env:RUNNER_TEMP "mohan-packaged-jit.txt"
          $env:PYTHON_JIT = $null
          $env:MOHAN_DISABLE_JIT = $null
          $process = Start-Process -FilePath $exe -ArgumentList @(
            "--self-test",
            "--self-test-output=$selfTest",
            "--jit-status-output=$jitTest"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Get-Content -Raw $selfTest) -ne "PACKAGED_SELFTEST_OK") {
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }
          if ((Get-Content -Raw $jitTest) -ne "PACKAGED_JIT_DEFAULT_OK") {
            throw "Packaged application did not enable Python 3.15 JIT by default"
          }
          $process = Start-Process -FilePath $exe -ArgumentList @(
            "--smoke-auto-exit",
            "--smoke-output=$smokeTest"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Get-Content -Raw $smokeTest) -ne "PACKAGED_EVENT_LOOP_OK") {
            throw "Packaged event-loop smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create Windows portable ZIP
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve-release.outputs.tag }}"
          $version = "${{ needs.resolve-release.outputs.version }}"
          $appDir = Join-Path $PWD "dist\MoHan-Desktop-Assistant-$version"
          if (-not (Test-Path $appDir)) { throw "Expected build folder not found: $appDir" }
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $zip = Join-Path $PWD "release-artifacts\MoHan-Desktop-Assistant-$tag-Windows-x64.zip"
          Compress-Archive -Path $appDir -DestinationPath $zip -CompressionLevel Optimal
          $extract = Join-Path $env:RUNNER_TEMP "mohan-release-zip"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $packageRoot = Join-Path $extract (Split-Path $appDir -Leaf)
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mohan-native-release"
          & $env:MOHAN_JIT_PYTHON tools/verify_packaged_native_acceleration.py `
            $packageRoot `
            --label "zip" `
            --artifact $zip `
            --output (Join-Path $evidenceDir "zip.json")

      - name: Build and verify EXE and MSI installers
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-release.outputs.version }}"
          .\installer\build_installers.ps1 `
            -AppDir "dist\MoHan-Desktop-Assistant-$version" `
            -Version $version `
            -Tag "${{ needs.resolve-release.outputs.tag }}" `
            -OutputDir "release-artifacts"
          .\installer\test_installers.ps1 `
            -ArtifactsDir "release-artifacts" `
            -Version $version `
            -Python $env:MOHAN_JIT_PYTHON `
            -NativeEvidenceDir (Join-Path $env:RUNNER_TEMP "mohan-native-release") `
            -PreviousVersion "3.1.2" `
            -PreviousExeUrl "https://github.com/hitoshic1982/MoHan-PC-Desktop-Assistant/releases/download/v3.1.2/MoHan-Desktop-Assistant-v3.1.2-Windows-x64-Setup.exe" `
            -PreviousExeSha256 "1a3cf537faab72ca9508a8440a4c3bd2115b6af927f260217f272cfb39631c8e" `
            -PreviousMsiUrl "https://github.com/hitoshic1982/MoHan-PC-Desktop-Assistant/releases/download/v3.1.2/MoHan-Desktop-Assistant-v3.1.2-Windows-x64.msi" `
            -PreviousMsiSha256 "1f0118f2c88497e1e88b62668e968a4d82dc0f64ac5971739d4f895e3fc619a9" `
            -RequirePoseAtlas

      - name: Finalize native evidence and Rust SBOM
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve-release.outputs.tag }}"
          $ErrorActionPreference = "Stop"
          $base = "MoHan-Desktop-Assistant-$tag"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mohan-native-release"
          $nativeEvidence = Join-Path $PWD "release-artifacts\$base-Native-Evidence.json"
          & $env:MOHAN_JIT_PYTHON tools/finalize_native_release_evidence.py `
            --verifications $evidenceDir `
            --artifacts "release-artifacts" `
            --tag $tag `
            --output $nativeEvidence
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $env:MOHAN_JIT_PYTHON tools/generate_native_sbom.py `
            --evidence $nativeEvidence `
            --tag $tag `
            --output "release-artifacts\$base-Windows-Native-SBOM.cdx.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  macos-preview:
    name: macOS ${{ matrix.architecture }} limited Preview DMG
    needs: resolve-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements-preview.txt

      - name: Build verified Qt 3.15 compatibility wheelhouse
        run: python tools/build_python315_qt_compat.py --output-dir qt315-wheelhouse --requirements requirements-preview.txt

      - name: Install pinned Preview dependencies
        run: >-
          python tools/install_python315_dependencies.py
          --requirements requirements-preview.txt
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Verify source Preview contract
        run: python tests/test_preview_packaging.py

      - name: Check out pinned CPython 3.15.0rc1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: python/cpython
          ref: 37e98da7c19a9e5892ee756d6dee08225422cd49
          path: _python315
          persist-credentials: false

      - name: Install supported LLVM 21 JIT toolchain
        uses: ./.github/actions/setup-llvm21

      - name: Build and verify JIT-default Python 3.15 runtime
        shell: bash
        run: |
          python tools/build_python315_jit_runtime.py \
            --source "$PWD/_python315" \
            --prefix "$RUNNER_TEMP/mohan-python315-jit"
          echo "MOHAN_JIT_PYTHON=$RUNNER_TEMP/mohan-python315-jit/bin/python3.15" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/mohan-python315-jit/lib" >> "$GITHUB_ENV"

      - name: Install dependencies into JIT-default Python
        run: >-
          "$MOHAN_JIT_PYTHON" tools/install_python315_dependencies.py
          --requirements requirements-preview.txt
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Build native macOS Preview DMG
        run: >-
          "$MOHAN_JIT_PYTHON" tools/build_preview_package.py
          --platform macos
          --version "${{ needs.resolve-release.outputs.version }}"
          --output-dir release-artifacts
          --require-pose-atlas

      - name: Mount DMG and smoke-test packaged app
        shell: bash
        run: |
          package=(release-artifacts/*-macOS-${{ matrix.architecture }}-Preview.dmg)
          [[ ${#package[@]} -eq 1 ]]
          python tools/smoke_preview_package.py \
            --platform macos \
            --package "${package[0]}" \
            --expected-version "${{ needs.resolve-release.outputs.version }}" \
            --require-pose-atlas

      - name: Upload verified macOS Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-preview-${{ matrix.architecture }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  linux-preview:
    name: Linux limited Preview AppImage
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      APPIMAGETOOL_SHA256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements-preview.txt

      - name: Install Ubuntu Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Build verified Qt 3.15 compatibility wheelhouse
        run: python tools/build_python315_qt_compat.py --output-dir qt315-wheelhouse --requirements requirements-preview.txt

      - name: Install pinned Preview dependencies
        run: >-
          python tools/install_python315_dependencies.py
          --requirements requirements-preview.txt
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Verify source Preview contract
        run: python tests/test_preview_packaging.py

      - name: Check out pinned CPython 3.15.0rc1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: python/cpython
          ref: 37e98da7c19a9e5892ee756d6dee08225422cd49
          path: _python315
          persist-credentials: false

      - name: Install supported LLVM 21 JIT toolchain
        uses: ./.github/actions/setup-llvm21

      - name: Build and verify JIT-default Python 3.15 runtime
        shell: bash
        run: |
          python tools/build_python315_jit_runtime.py \
            --source "$PWD/_python315" \
            --prefix "$RUNNER_TEMP/mohan-python315-jit"
          echo "MOHAN_JIT_PYTHON=$RUNNER_TEMP/mohan-python315-jit/bin/python3.15" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mohan-python315-jit/lib" >> "$GITHUB_ENV"

      - name: Install dependencies into JIT-default Python
        run: >-
          "$MOHAN_JIT_PYTHON" tools/install_python315_dependencies.py
          --requirements requirements-preview.txt
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Download and verify pinned official appimagetool
        shell: bash
        run: |
          # Official AppImage/appimagetool asset, source commit
          # 8c8c91f762b412a19f4e8d2c4b35afb98f2d7c81, asset ID 324406882.
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"

      - name: Build verified Linux Preview AppImage
        shell: bash
        run: |
          "$MOHAN_JIT_PYTHON" tools/build_preview_package.py \
            --platform linux \
            --version "${{ needs.resolve-release.outputs.version }}" \
            --output-dir release-artifacts \
            --appimagetool "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            --require-pose-atlas

      - name: Execute packaged AppImage smoke test
        shell: bash
        run: |
          package=(release-artifacts/*-Linux-x86_64-Preview.AppImage)
          [[ ${#package[@]} -eq 1 ]]
          python tools/smoke_preview_package.py \
            --platform linux \
            --package "${package[0]}" \
            --expected-version "${{ needs.resolve-release.outputs.version }}" \
            --require-pose-atlas

      - name: Upload verified Linux Preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-preview
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  metadata:
    name: generate-release-metadata
    needs: [resolve-release, windows, macos-preview, linux-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Set up Python 3.15 release metadata runtime
        id: runtime-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip

      - name: Set up isolated Python 3.14 SBOM tooling runtime
        id: sbom-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Download all verified platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create, finalize, and validate CycloneDX 1.7 SBOMs
        run: |
          sbom_python="${{ steps.sbom-python.outputs.python-path }}"
          runtime_python="${{ steps.runtime-python.outputs.python-path }}"
          base="MoHan-Desktop-Assistant-${{ needs.resolve-release.outputs.tag }}"
          "$sbom_python" -m pip install cyclonedx-bom==7.3.0
          "$sbom_python" -m cyclonedx_py requirements requirements-runtime.txt \
            --pyproject pyproject.toml \
            --mc-type application \
            --spec-version 1.7 \
            --output-reproducible \
            --validate \
            --output-format JSON \
            --output-file "release-artifacts/$base-Windows-SBOM.cdx.json"
          "$sbom_python" -m cyclonedx_py requirements requirements-preview-runtime.txt \
            --pyproject sbom/preview.pyproject.toml \
            --mc-type application \
            --spec-version 1.7 \
            --output-reproducible \
            --validate \
            --output-format JSON \
            --output-file "release-artifacts/$base-Preview-SBOM.cdx.json"
          "$runtime_python" tools/validate_release_sboms.py \
            --tag "${{ needs.resolve-release.outputs.tag }}" \
            --entry windows "release-artifacts/$base-Windows-SBOM.cdx.json" requirements-runtime.txt pyproject.toml mohan-desktop-assistant \
            --entry preview "release-artifacts/$base-Preview-SBOM.cdx.json" requirements-preview-runtime.txt sbom/preview.pyproject.toml mohan-desktop-assistant-preview \
            --schema-python "$sbom_python" \
            --output "release-artifacts/$base-SBOM-Validation.json"
          "$runtime_python" tools/validate_native_sbom.py \
            --sbom "release-artifacts/$base-Windows-Native-SBOM.cdx.json" \
            --evidence "release-artifacts/$base-Native-Evidence.json" \
            --schema-python "$sbom_python"
          "$runtime_python" tools/create_release_metadata.py \
            --artifacts release-artifacts \
            --tag "${{ needs.resolve-release.outputs.tag }}" \
            --repository "${{ github.repository }}"

      - name: Upload read-only generated metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: |
            release-artifacts/*-Windows-SBOM.cdx.json
            release-artifacts/*-Preview-SBOM.cdx.json
            release-artifacts/*-SBOM-Validation.json
            release-artifacts/*-update.json
            release-artifacts/*-SHA256SUMS.txt
            release-artifacts/*-SHA256.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: verify-or-publish-one-release
    needs: [resolve-release, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out immutable curated notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Download verified packages and read-only metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Re-verify exact artifact set and SHA256 catalog
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          base="MoHan-Desktop-Assistant-$RELEASE_TAG"
          expected=(
            "$base-Windows-x64-Setup.exe"
            "$base-Windows-x64.msi"
            "$base-en-US.mst"
            "$base-zh-CN.mst"
            "$base-ja-JP.mst"
            "$base-Windows-x64.zip"
            "$base-macOS-arm64-Preview.dmg"
            "$base-macOS-x86_64-Preview.dmg"
            "$base-Linux-x86_64-Preview.AppImage"
            "$base-Windows-SBOM.cdx.json"
            "$base-Windows-Native-SBOM.cdx.json"
            "$base-Preview-SBOM.cdx.json"
            "$base-SBOM-Validation.json"
            "$base-Native-Evidence.json"
            "$base-Performance-Evidence.zip"
            "$base-Performance-Summary.json"
            "$base-update.json"
            "$base-SHA256SUMS.txt"
            "$base-SHA256.txt"
          )
          for name in "${expected[@]}"; do
            [[ -f "release-artifacts/$name" ]] || {
              echo "Missing required release artifact: $name" >&2
              exit 5
            }
          done
          actual_count=$(find release-artifacts -maxdepth 1 -type f | wc -l)
          [[ "$actual_count" -eq "${#expected[@]}" ]] || {
            echo "Unexpected release artifact count: $actual_count" >&2
            exit 6
          }
          cmp --silent \
            "release-artifacts/$base-SHA256SUMS.txt" \
            "release-artifacts/$base-SHA256.txt"
          (
            cd release-artifacts
            sha256sum --check --strict "$base-SHA256SUMS.txt"
          )

      - name: Require the release tag to still identify the validated commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/release-recheck-${GITHUB_RUN_ID}"
          actual=$(git rev-parse "refs/tags/release-recheck-${GITHUB_RUN_ID}^{commit}")
          if [[ "$actual" != "$EXPECTED_COMMIT" || "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ]]; then
            echo "Release tag changed after validation; refusing publication." >&2
            exit 4
          fi

      - name: Attest every published artifact
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || inputs.publish }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*

      - name: Verify existing release without modifying it
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          release_id="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)"
          [[ "$release_id" =~ ^[0-9]+$ ]] || {
            echo "Expected an existing Release for verification: $tag" >&2
            exit 7
          }
          [[ "$(gh api "repos/${{ github.repository }}/releases/$release_id" --jq ".draft == false and .prerelease == $EXPECTED_PRERELEASE")" == true ]]
          assets_json="$(mktemp)"
          gh api --paginate "repos/${{ github.repository }}/releases/$release_id/assets" > "$assets_json"
          mapfile -t actual_assets < <(jq -r '.[].name' "$assets_json" | sort)
          mapfile -t expected_assets < <(find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "$(printf '%s\n' "${actual_assets[@]}")" == "$(printf '%s\n' "${expected_assets[@]}")" ]] || {
            echo "Existing Release assets differ from the exact verified set." >&2
            exit 8
          }
          while IFS= read -r expected; do
            name="$(basename "$expected")"
            expected_size="$(stat -c '%s' "$expected")"
            asset="$(jq -c --arg name "$name" '.[] | select(.name == $name)' "$assets_json")"
            [[ "$(jq -r '.size' <<< "$asset")" == "$expected_size" ]] || {
              echo "Existing Release asset size differs: $name" >&2
              exit 9
            }
            downloaded="$(mktemp)"
            gh api -H 'Accept: application/octet-stream' "$(jq -r '.url' <<< "$asset")" > "$downloaded"
            cmp --silent "$expected" "$downloaded" || {
              echo "Existing Release asset content differs: $name" >&2
              exit 10
            }
          done < <(find release-artifacts -maxdepth 1 -type f | sort)
          echo "Release $tag is unchanged and matches the verified artifact set."

      - name: Publish or upload one GitHub release
        if: ${{ github.event_name == 'push' || github.event_name == 'release' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          release_title="墨寒桌面助理 $tag／墨寒桌面助手 $tag／MoHan Desktop Assistant $tag／墨寒デスクトップアシスタント $tag"
          readonly release_title
          mapfile -d '' assets < <(find release-artifacts -maxdepth 1 -type f -print0 | sort -z)
          existing_id="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)"
          if [[ -n "$existing_id" ]]; then
            # release-please 已建立 release（可能無資產）：直接上傳資產，不重建。
            echo "Release $tag already exists; uploading verified assets instead of rebuilding."
            release_id="$existing_id"
            for asset in "${assets[@]}"; do
              gh release upload "$tag" "$asset" --repo "${{ github.repository }}" --clobber
            done
          else
            release_id=''
            published=false
            cleanup_failed_draft() {
              status=$?
              if [[ $status -ne 0 && "$published" != true && -n "$release_id" ]]; then
                gh api --method DELETE "repos/${{ github.repository }}/releases/$release_id" >/dev/null 2>&1 || true
              fi
              trap - EXIT
              exit "$status"
            }
            trap cleanup_failed_draft EXIT
            release_args=(
              "$tag" "${assets[@]}"
              --repo "${{ github.repository }}"
              --verify-tag
              --draft
              --title "$release_title"
              --notes-file "docs/releases/$tag.md"
            )
            if [[ "$EXPECTED_PRERELEASE" == true ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
            release_id="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\" and .draft == true) | .id" | head -n 1)"
            [[ "$release_id" =~ ^[0-9]+$ ]]
            gh api --method PATCH "repos/${{ github.repository }}/releases/$release_id" \
              -F draft=false -F prerelease="$EXPECTED_PRERELEASE" >/dev/null
            [[ "$(gh api "repos/${{ github.repository }}/releases/$release_id" --jq ".draft == false and .prerelease == $EXPECTED_PRERELEASE")" == true ]]
            published=true
            trap - EXIT
          fi
          mapfile -t actual_assets < <(gh api --paginate "repos/${{ github.repository }}/releases/$release_id/assets" --jq '.[].name' | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${assets[@]##*/}" | sort)
          [[ "$(printf '%s\n' "${actual_assets[@]}")" == "$(printf '%s\n' "${expected_assets[@]}")" ]] || {
            echo "Release assets differ from the exact verified set." >&2
            exit 8
          }
          echo "Release $tag now carries the exact verified asset set."
