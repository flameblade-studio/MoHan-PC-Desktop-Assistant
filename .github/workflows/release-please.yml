name: Release Please

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@a02a34c4d62566be9cb72e5634d807a56fe2eeac # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
