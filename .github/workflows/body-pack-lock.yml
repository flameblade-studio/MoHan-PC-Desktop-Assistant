name: Body pack lock consistency

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: body-pack-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-body-pack-lock:
    name: Rebuild and verify the public MoHan body-pack release lock
    # The archive is published from Windows; PNG bytes depend on the platform's
    # Pillow/zlib build, so the byte-exact rebuild is verified on the release platform.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip

      - name: Install hash-locked official Qt wheels
        run: >-
          python -m pip install --only-binary=:all:
          --require-hashes
          --report qt-install-report.json
          -r requirements-qt.txt

      - name: Install pinned runtime dependencies from official wheels
        run: >-
          python -m pip install --only-binary=:all:
          -r requirements.txt

      - name: Verify official Qt runtime and wheel provenance
        run: >-
          python tools/check_official_qt_runtime.py
          --pip-report qt-install-report.json

      - name: Rebuild body pack and verify source, archive, and lock
        run: python tools/verify_body_pack_lock.py
