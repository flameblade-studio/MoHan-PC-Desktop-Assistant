name: Windows CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-static:
    name: test-static
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip

      - name: Restore Rust toolchain, registry, and native build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            native/mohan_accel/target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml', 'native/mohan_accel/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Build verified Qt 3.15 compatibility wheelhouse
        run: python tools/build_python315_qt_compat.py --output-dir qt315-wheelhouse

      - name: Install dependencies
        run: >-
          python tools/install_python315_dependencies.py
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Install pinned development quality tools
        run: >-
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Install pinned Rust native build toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Rust cache can restore ~/.cargo/bin; reinstall only when the pinned version is absent.
          $auditVersion = (cargo audit --version 2>$null)
          if (-not ($auditVersion -match '\b0\.22\.2\b')) {
            cargo install cargo-audit --version 0.22.2 --locked --force
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo audit --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: maturin==1.14.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify native acceleration
        shell: pwsh
        run: |
          python tools/build_native_acceleration.py `
            --output-dir native-wheels `
            --evidence native-wheels/build-evidence.json `
            --install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_native_equivalence.py tests/test_native_rgba_equivalence.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/benchmark_native_rgba.py --width 512 --height 512 --iterations 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify PYTHON_JIT forwarding and compare MoHan hot paths
        shell: pwsh
        run: |
          $env:PYTHON_JIT = "0"
          python -c "import sys; assert sys._jit.is_available() and not sys._jit.is_enabled()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHON_JIT = "1"
          python -c "import sys; assert sys._jit.is_available() and sys._jit.is_enabled()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:PYTHON_JIT -ErrorAction SilentlyContinue
          python tools/benchmark_python315_hotpaths.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repository static quality gate
        run: python tools/quality_gate.py --stages static

      - name: Capture and gate Python 3.15 Tachyon evidence
        run: >-
          python tools/profile_mohan_tachyon.py
          --target all
          --output-dir tachyon-evidence
          --min-samples 100
          --max-sample-read-error-percent 15
          --max-missed-samples-percent 10
          --duration 40

      - name: Upload sanitized Tachyon evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-tachyon-evidence
          path: tachyon-evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload prepared Windows test runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-runtime
          path: |
            qt315-wheelhouse/**
            native-wheels/**
          if-no-files-found: error
          retention-days: 1

  test-shard:
    name: test-shard (${{ matrix.shard-index }})
    needs: test-static
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip

      - name: Download prepared Windows test runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-test-runtime
          path: .

      - name: Install dependencies
        run: >-
          python tools/install_python315_dependencies.py
          --qt-compat-wheelhouse qt315-wheelhouse

      - name: Install pinned development quality tools
        run: >-
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Install prepared native acceleration wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem native-wheels -Filter *.whl | Select-Object -First 1
          if ($null -eq $wheel) { throw "Prepared native wheel is missing." }
          python -m pip install --only-binary=:all: $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete regression shard
        run: >-
          python tools/quality_gate.py
          --stages tests
          --shard-index ${{ matrix.shard-index }}
          --shard-count 8

  test:
    name: test
    needs: [test-static, test-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Windows test stage to pass
        env:
          STATIC_RESULT: ${{ needs.test-static.result }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
        shell: bash
        run: |
          if [[ "$STATIC_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "Windows test stages failed: static=$STATIC_RESULT shards=$SHARD_RESULT" >&2
            exit 1
          fi
          echo "All Windows test stages passed."

  installer:
    name: installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
          cache: pip
      - name: Restore Rust toolchain, registry, and native build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            native/mohan_accel/target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml', 'native/mohan_accel/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Build verified Qt 3.15 compatibility wheelhouse
        run: python tools/build_python315_qt_compat.py --output-dir qt315-wheelhouse
      - name: Check out pinned CPython 3.15.0rc1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: python/cpython
          ref: 37e98da7c19a9e5892ee756d6dee08225422cd49
          path: _python315
          persist-credentials: false
      - name: Build and verify JIT-default Python 3.15 runtime
        shell: pwsh
        run: |
          python tools/build_python315_jit_runtime.py `
            --source "$PWD\_python315" `
            --prefix "$env:RUNNER_TEMP\mohan-python315-jit"
          "MOHAN_JIT_PYTHON=$PWD\_python315\PCbuild\amd64\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install runtime dependencies into JIT-default Python
        shell: pwsh
        run: >-
          & $env:MOHAN_JIT_PYTHON tools/install_python315_dependencies.py
          --qt-compat-wheelhouse qt315-wheelhouse
      - name: Install pinned Rust and native build toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:MOHAN_JIT_PYTHON -m pip install --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:MOHAN_JIT_PYTHON -m pip install --only-binary=:all: maturin==1.14.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Windows installer toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          .\tools\install_windows_packaging_tools.ps1
          -InnoVersion "7.0.2"
          -WixVersion "7.0.0"
      - name: Build packaged application
        shell: pwsh
        run: .\build.ps1 -Version "4.0.0-rc.1" -Python $env:MOHAN_JIT_PYTHON
      - name: Verify native equivalence and packaged operations
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mohan-native-ci"
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          & $env:MOHAN_JIT_PYTHON -m pytest tests/test_native_equivalence.py tests/test_native_rgba_equivalence.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:MOHAN_JIT_PYTHON tools/benchmark_native_rgba.py --width 512 --height 512 --iterations 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:MOHAN_JIT_PYTHON tools/verify_packaged_native_acceleration.py `
            "dist\MoHan-Desktop-Assistant-4.0.0-rc.1" `
            --label "onedir" `
            --output (Join-Path $evidenceDir "onedir.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract and strictly verify portable ZIP
        shell: pwsh
        run: |
          $tag = "v4.0.0-rc.1"
          $version = "4.0.0-rc.1"
          $appDir = Join-Path $PWD "dist\MoHan-Desktop-Assistant-$version"
          $artifacts = Join-Path $PWD "ci-installers"
          $extract = Join-Path $env:RUNNER_TEMP "mohan-ci-zip"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mohan-native-ci"
          New-Item -ItemType Directory -Force $artifacts | Out-Null
          $zip = Join-Path $artifacts "MoHan-Desktop-Assistant-$tag-Windows-x64.zip"
          Compress-Archive -Path $appDir -DestinationPath $zip -CompressionLevel Optimal
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $packageRoot = Join-Path $extract (Split-Path $appDir -Leaf)
          & $env:MOHAN_JIT_PYTHON tools/verify_packaged_native_acceleration.py `
            $packageRoot `
            --label "zip" `
            --artifact $zip `
            --output (Join-Path $evidenceDir "zip.json")
      - name: Build EXE and MSI installers
        shell: pwsh
        run: |
          .\installer\build_installers.ps1 `
            -AppDir "dist\MoHan-Desktop-Assistant-4.0.0-rc.1" `
            -Version "4.0.0-rc.1" `
            -Tag "v4.0.0-rc.1" `
            -OutputDir "ci-installers"
      - name: Install, self-test, and uninstall both formats
        shell: pwsh
        run: |
          .\installer\test_installers.ps1 `
            -ArtifactsDir "ci-installers" `
            -Version "4.0.0-rc.1" `
            -Python $env:MOHAN_JIT_PYTHON `
            -NativeEvidenceDir (Join-Path $env:RUNNER_TEMP "mohan-native-ci") `
            -PreviousVersion "3.1.2" `
            -PreviousExeUrl "https://github.com/flameblade-studio/MoHan-PC-Desktop-Assistant/releases/download/v3.1.2/MoHan-Desktop-Assistant-v3.1.2-Windows-x64-Setup.exe" `
            -PreviousExeSha256 "1a3cf537faab72ca9508a8440a4c3bd2115b6af927f260217f272cfb39631c8e" `
            -PreviousMsiUrl "https://github.com/flameblade-studio/MoHan-PC-Desktop-Assistant/releases/download/v3.1.2/MoHan-Desktop-Assistant-v3.1.2-Windows-x64.msi" `
            -PreviousMsiSha256 "1f0118f2c88497e1e88b62668e968a4d82dc0f64ac5971739d4f895e3fc619a9"

      - name: Set up isolated Python 3.14 SBOM tooling runtime
        id: sbom-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Finalize native evidence and Rust SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v4.0.0-rc.1"
          $base = "MoHan-Desktop-Assistant-$tag"
          $evidenceDir = Join-Path $env:RUNNER_TEMP "mohan-native-ci"
          $nativeEvidence = Join-Path $PWD "ci-installers\$base-Native-Evidence.json"
          & $env:MOHAN_JIT_PYTHON tools/finalize_native_release_evidence.py `
            --verifications $evidenceDir `
            --artifacts "ci-installers" `
            --tag $tag `
            --output $nativeEvidence
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $env:MOHAN_JIT_PYTHON tools/generate_native_sbom.py `
            --evidence $nativeEvidence `
            --tag $tag `
            --output "ci-installers\$base-Windows-Native-SBOM.cdx.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $sbomPython = "${{ steps.sbom-python.outputs.python-path }}"
          & $sbomPython -m pip install `
            --only-binary=:all: `
            cyclonedx-bom==7.3.0
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $env:MOHAN_JIT_PYTHON tools/validate_native_sbom.py `
            --sbom "ci-installers\$base-Windows-Native-SBOM.cdx.json" `
            --evidence $nativeEvidence `
            --schema-python $sbomPython
