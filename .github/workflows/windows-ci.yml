name: Windows CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Audit public release contents
        run: python tools/audit_public_release.py

      - name: Run full regression suite
        run: python tests/run_all.py

  installer:
    name: installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Windows installer toolchains
        shell: pwsh
        run: choco install innosetup wixtoolset --no-progress -y
      - name: Build packaged application
        shell: pwsh
        run: .\build.ps1 -Version "2.0.15-ci" -Python (Get-Command python).Source
      - name: Build EXE and MSI installers
        shell: pwsh
        run: |
          .\installer\build_installers.ps1 `
            -AppDir "dist\MoHan-Desktop-Assistant-2.0.15-ci" `
            -Version "2.0.15-ci" `
            -Tag "v2.0.15-ci" `
            -OutputDir "ci-installers"
      - name: Install, self-test, and uninstall both formats
        shell: pwsh
        run: .\installer\test_installers.ps1 -ArtifactsDir "ci-installers" -Version "2.0.15-ci"
