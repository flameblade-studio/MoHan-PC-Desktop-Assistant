name: Set up supported LLVM 21
description: Install and verify the LLVM 21 tools required by the CPython 3.15 JIT

runs:
  using: composite
  steps:
    - name: Install LLVM 21 on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@21
        llvm_prefix="$(brew --prefix llvm@21)"
        for tool in clang llvm-readobj llvm-objdump llvm-dwarfdump; do
          "$llvm_prefix/bin/$tool" --version
        done
        echo "LLVM_TOOLS_INSTALL_DIR=$llvm_prefix" >> "$GITHUB_ENV"

    - name: Install signed LLVM 21 packages on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        key_file="$RUNNER_TEMP/llvm-snapshot.gpg.key"
        keyring_file="$RUNNER_TEMP/llvm-snapshot.gpg"
        expected_fingerprint="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
        curl --fail --location --retry 3 --output "$key_file" "https://apt.llvm.org/llvm-snapshot.gpg.key"
        actual_fingerprint="$(
          gpg --batch --show-keys --with-colons "$key_file" |
            awk -F: '$1 == "fpr" { print $10; exit }'
        )"
        [[ "$actual_fingerprint" == "$expected_fingerprint" ]]
        gpg --batch --dearmor --output "$keyring_file" "$key_file"
        sudo install -m 0644 "$keyring_file" /usr/share/keyrings/apt.llvm.org.gpg
        echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" |
          sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
        sudo apt-get update
        sudo apt-get install --yes clang-21 llvm-21
        llvm_prefix="/usr/lib/llvm-21"
        for tool in clang llvm-readobj llvm-objdump llvm-dwarfdump; do
          "$llvm_prefix/bin/$tool" --version
        done
        echo "LLVM_TOOLS_INSTALL_DIR=$llvm_prefix" >> "$GITHUB_ENV"
