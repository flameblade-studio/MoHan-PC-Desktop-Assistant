name: Bug report / 錯誤回報
description: Report a reproducible problem without private data. 回報可重現問題。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MoHan. 謝謝您協助改善墨寒。

        Do not attach API keys, OAuth files, databases, private conversations,
        email, addresses, recordings, or unredacted screenshots.
        請勿附上 API 金鑰、OAuth 檔案、資料庫、私人對話、郵件、住址、錄音或未遮蔽截圖。
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隱私確認
      options:
        - label: I removed all secrets and personal data. 我已移除所有機密與個人資料。
          required: true
  - type: input
    id: version
    attributes:
      label: MoHan version / 墨寒版本
      placeholder: v2.0.14-rc.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 問題範圍
      options:
        - Desktop character / animation
        - Text conversation
        - Microphone / transcription
        - Realtime voice
        - Tasks / memories / progress
        - Tools / permissions
        - Home Assistant / remote
        - Packaging / startup
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 重現步驟
      description: State the smallest exact sequence that triggers the problem. 請列出最短且明確的操作順序。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 實際結果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and audio environment / 系統與語音環境
      placeholder: Windows version, installation type, microphone, voice engine, relevant model
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Last known working version / 最後正常版本
      description: If known, state the last version where this worked normally. 若知道，請填寫最後正常運作的版本。
