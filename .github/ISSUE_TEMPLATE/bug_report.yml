name: Bug report / 錯誤回報
description: Report a reproducible problem with privacy-safe details. 回報可重現問題並提供隱私安全的資料。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MoHan. 謝謝您協助改善墨寒。

        Attach redacted diagnostic material only. Keep API keys, OAuth files,
        databases, private conversations, email, addresses, and recordings in
        their private storage, and redact every screenshot.
        僅附上已遮蔽的診斷資料。API 金鑰、OAuth 檔案、資料庫、私人對話、郵件、
        住址與錄音請留在私人儲存位置，所有截圖請先完成遮蔽。
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隱私確認
      options:
        - label: I reviewed the report and kept secrets and personal data private. 我已檢查回報內容，並將機密與個人資料留在私人環境。
          required: true
  - type: input
    id: version
    attributes:
      label: MoHan version / 墨寒版本
      placeholder: v2.0.14-rc.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 問題範圍
      options:
        - Desktop character / animation
        - Text conversation
        - Microphone / transcription
        - Realtime voice
        - Tasks / memories / progress
        - Tools / permissions
        - Home Assistant / remote
        - Packaging / startup
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 重現步驟
      description: State the smallest exact sequence that triggers the problem. 請列出最短且明確的操作順序。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 實際結果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and audio environment / 系統與語音環境
      placeholder: Windows version, installation type, microphone, voice engine, relevant model
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Last known working version / 最後正常版本
      description: If known, state the last version where this worked normally. 若知道，請填寫最後正常運作的版本。
