name: Question or support / 使用問題
description: Ask about setup or expected behavior with privacy-safe details. 以隱私安全的資料詢問安裝或操作方式。
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Share privacy-safe setup details. Keep API keys, OAuth credentials,
        private conversations, email, recordings, and databases in private
        storage, and redact every screenshot before sharing.
        請提供隱私安全的設定資料。API 金鑰、OAuth 憑證、私人對話、郵件、錄音與
        資料庫請留在私人儲存位置，分享前請先遮蔽所有截圖。
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隱私確認
      options:
        - label: I reviewed the report and kept secrets and personal data private. 我已檢查回報內容，並將機密與個人資料留在私人環境。
          required: true
  - type: input
    id: version
    attributes:
      label: MoHan version / 墨寒版本
      placeholder: v2.0.14-rc.1
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question / 問題
      description: Describe what you want to do and where you became stuck. 請說明目標及卡住的步驟。
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried? / 已嘗試方式
  - type: textarea
    id: environment
    attributes:
      label: Environment / 使用環境
      placeholder: Windows version, installation type, voice mode, relevant integration
