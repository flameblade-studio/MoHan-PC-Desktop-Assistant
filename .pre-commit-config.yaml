# Pre-commit hooks for MoHan.
#
# Install once with:
#   pip install pre-commit
#   pre-commit install
#
# After that, every `git commit` runs these checks and blocks the commit if
# any fail. The ruff hook enforces the same release-blocking gate as CI
# (Pyflakes + PLR2004 magic-value-comparison), so a new magic number is
# rejected at commit time instead of accumulating for a later cleanup pass.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: ruff (Pyflakes + magic-value-comparison)
        args: ["check", "."]
