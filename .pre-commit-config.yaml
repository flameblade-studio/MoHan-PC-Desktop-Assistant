# Pre-commit hooks for MoHan.
#
# Install once with:
#   pip install pre-commit
#   pre-commit install
#
# After that, every `git commit` runs these checks and reports the result
# before the commit is created. The ruff hook enforces the same release gate
# as CI (Pyflakes + PLR2004 magic-value-comparison), so each new magic number
# receives feedback at commit time and stays within the quality policy.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: ruff (Pyflakes + magic-value-comparison)
        args: ["check", "."]
