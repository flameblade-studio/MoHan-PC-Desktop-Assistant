[project]
name = "mohan-desktop-assistant"
version = "3.0.0"
description = "A multilingual, voice-interactive desktop companion by Flameblade Studio."
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Flameblade Studio" },
]
dependencies = [
  "PySide6==6.11.1",
  "sounddevice==0.5.5",
  "websocket-client==1.9.0",
  "opencc-python-reimplemented==0.1.7",
]
keywords = [
  "desktop-assistant",
  "multilingual",
  "pyside6",
  "speech",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.15",
  "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://www.flamebladestudio.com.tw/mohan-desktop-assistant/"
Repository = "https://github.com/hitoshic1982/MoHan-PC-Desktop-Assistant"
Issues = "https://github.com/hitoshic1982/MoHan-PC-Desktop-Assistant/issues"
