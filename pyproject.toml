[project]
name = "mohan-desktop-assistant"
version = "4.7.0"
description = "A multilingual, voice-interactive desktop companion by Flameblade Studio."
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Flameblade Studio" },
]
dependencies = [
  "azure-cognitiveservices-speech==1.50.0",
  "certifi==2026.7.22",
  "cryptography==50.0.0",
  "Pillow==12.3.0",
  "PySide6==6.11.1",
  "sounddevice==0.5.5",
  "websocket-client==1.9.0",
  "opencc-python-reimplemented==0.1.7",
  "numpy==2.5.2",
  "opencv-python==5.0.0.93",
]
keywords = [
  "desktop-assistant",
  "multilingual",
  "pyside6",
  "speech",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.15",
  "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://www.flamebladestudio.com.tw/mohan-desktop-assistant/"
Repository = "https://github.com/flameblade-studio/MoHan-PC-Desktop-Assistant"
Issues = "https://github.com/flameblade-studio/MoHan-PC-Desktop-Assistant/issues"

[tool.deptry]
requirements_files = [
  "requirements.txt",
  "requirements-runtime.txt",
  "requirements-preview.txt",
  "requirements-preview-runtime.txt",
]
requirements_files_dev = ["requirements-dev.txt"]
known_first_party = [
  "application",
  "domain",
  "huapu",
  "infrastructure",
  "integrations",
  "presentation",
  "tools",
]
extend_exclude = ["\\.quality-tmp", "\\.venv315"]

# certifi is pinned for the Azure Speech TLS dependency chain documented in
# THIRD_PARTY_NOTICES.md and sbom/components.toml; its use is indirect.
[tool.deptry.per_rule_ignores]
DEP002 = ["certifi"]

[tool.deptry.package_module_name_map]
"azure-cognitiveservices-speech" = "azure"
"opencc-python-reimplemented" = "opencc"
"opencv-python" = "cv2"
"websocket-client" = "websocket"
