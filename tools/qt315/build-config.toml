schema_version = 1
source_repository = "https://code.qt.io/pyside/pyside-setup.git"
pyside_source_commit = "1e708e23e1b7a221e662bc2e5c51fae9e7a8764f"
qt_sdk_version = "6.11.1"
python_requirement = ">=3.15,<3.16"
wheel_version = "6.11.1+mohan.py315.1"
